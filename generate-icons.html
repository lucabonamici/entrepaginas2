<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gerar Ícones - Entre Páginas</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #FFFBEB;
      color: #1C1713;
    }
    h2 { color: #92400E; }
    .button-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      background: #92400E;
      color: #FFFBEB;
      border: none;
      border-radius: 6px;
      font-weight: 600;
    }
    button:hover { background: #D97706; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      font-size: 14px;
      min-width: 30px;
    }
    .done { color: #059669; font-weight: 600; }
    small { color: #78716C; }
  </style>
</head>
<body>
<h2>🎨 Gerar Ícones - Entre Páginas</h2>
<p>Clica em cada botão para descarregar os ícones PNG:</p>

<div class="button-row">
  <button onclick="downloadIcon(192, 'icon-192.png', this)">Descarregar 192×192</button>
  <span class="status" id="status-192"></span>
</div>

<div class="button-row">
  <button onclick="downloadIcon(512, 'icon-512.png', this)">Descarregar 512×512</button>
  <span class="status" id="status-512"></span>
</div>

<div class="button-row">
  <button onclick="downloadIcon(72, 'icon-72.png', this)">Descarregar 72×72</button>
  <span class="status" id="status-72"></span>
</div>

<p><small>Depois de descarregar os 3 ficheiros, coloca-os na pasta <code>/entrepaginas2/</code> do teu repositório GitHub.</small></p>
<canvas id="c" style="display:none"></canvas>

<script>
function drawIcon(size) {
  const c = document.getElementById('c');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = size * 0.14;

  /* background */
  ctx.fillStyle = '#92400E';
  roundRect(ctx, 0, 0, size, size, r);
  ctx.fill();

  /* open book */
  ctx.strokeStyle = '#FEF3C7';
  ctx.lineWidth = size * 0.055;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const cx = size / 2, cy = size / 2;
  const bw = size * 0.58, bh = size * 0.46;
  const x0 = cx - bw / 2, x1 = cx + bw / 2, y0 = cy - bh / 2, y1 = cy + bh / 2;

  /* left page */
  ctx.beginPath();
  ctx.moveTo(cx, y0 + size * 0.04);
  ctx.quadraticCurveTo(x0 + bw * 0.1, y0, x0, y0);
  ctx.lineTo(x0, y1);
  ctx.quadraticCurveTo(x0 + bw * 0.1, y1, cx, y1 - size * 0.04);
  ctx.stroke();

  /* right page */
  ctx.beginPath();
  ctx.moveTo(cx, y0 + size * 0.04);
  ctx.quadraticCurveTo(x1 - bw * 0.1, y0, x1, y0);
  ctx.lineTo(x1, y1);
  ctx.quadraticCurveTo(x1 - bw * 0.1, y1, cx, y1 - size * 0.04);
  ctx.stroke();

  /* spine */
  ctx.beginPath();
  ctx.moveTo(cx, y0 + size * 0.04);
  ctx.lineTo(cx, y1 - size * 0.04);
  ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function downloadIcon(size, name, btn) {
  drawIcon(size);
  const a = document.createElement('a');
  a.download = name;
  a.href = document.getElementById('c').toDataURL('image/png');
  a.click();

  /* show status */
  const statusId = 'status-' + size;
  const status = document.getElementById(statusId);
  status.textContent = '✓ Done';
  status.classList.add('done');
  btn.disabled = true;
}
</script>
</body>
</html>
